<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Personalized Brain Performance Plan — Psyked</title>
  <meta name="description" content="Your personalized Priority Stack and targeted protocols, based on your Brain Performance Quiz results." />
  <!-- Personal results page — not for indexing -->
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .plan-page { min-height: 100vh; background: var(--bg-base); }
    .plan-nav {
      position: sticky; top: 0; z-index: 100; display: flex; align-items: center;
      justify-content: space-between; padding: 0 24px; height: 56px;
      background: rgba(4,7,15,.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border);
    }
    .plan-nav .brand { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: .08em; }
    .plan-nav .back { font-size: 13px; font-weight: 500; color: var(--text-secondary); text-decoration: none; }
    .plan-nav .back:hover { color: var(--accent); }
    .plan-main { max-width: 760px; margin: 0 auto; padding: 48px 20px 90px; }
    .plan-header { text-align: center; margin-bottom: 48px; }
    .plan-badge {
      display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase; color: #00FFA3;
      background: rgba(0,255,163,.07); border: 1px solid rgba(0,255,163,.2);
      padding: 5px 14px; border-radius: 99px; margin-bottom: 20px;
    }
    .plan-title {
      font-family: var(--font-display); font-size: clamp(26px,5vw,42px); font-weight: 700;
      line-height: 1.15; margin-bottom: 14px;
    }
    .plan-sub { font-size: 16px; color: var(--text-secondary); line-height: 1.6; max-width: 560px; margin: 0 auto; }
    .region-block {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 32px; margin-bottom: 24px; position: relative; overflow: hidden;
    }
    .region-block.rank1 { border-color: rgba(0,212,255,.35); box-shadow: 0 0 40px rgba(0,212,255,.05); }
    .region-block.rank2 { border-color: rgba(123,47,255,.25); }
    .region-block.rank3 { border-color: rgba(0,212,255,.14); }
    .rb-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    .rb-rank {
      flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 16px; font-weight: 700;
      color: var(--accent); background: rgba(0,212,255,.08); border: 1px solid rgba(0,212,255,.25);
    }
    .rb-name { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.1; }
    .rb-abbr { font-size: 12px; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; }
    .rb-goal-tag {
      margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: #FF9933; background: rgba(255,153,51,.1); border: 1px solid rgba(255,153,51,.3);
      padding: 4px 10px; border-radius: 99px;
    }
    .rb-insight { font-size: 15px; color: var(--text-secondary); line-height: 1.65; margin-bottom: 22px; }
    .rb-start {
      background: rgba(0,255,163,.05); border: 1px solid rgba(0,255,163,.18);
      border-radius: var(--radius-md); padding: 18px 20px; margin-bottom: 22px;
    }
    .rb-start-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #00FFA3; margin-bottom: 8px; }
    .rb-start-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .rb-start-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
    .rb-protocols-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
    .rb-protocols { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .rb-protocol { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--text-secondary); line-height: 1.5; }
    .rb-protocol .num {
      flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; margin-top: 1px;
      color: var(--accent); background: rgba(0,212,255,.08); border: 1px solid rgba(0,212,255,.18);
    }
    .rb-protocol strong { color: var(--text-primary); font-weight: 600; }
    .plan-cta { text-align: center; margin-top: 44px; }
    .plan-cta p { font-size: 15px; color: var(--text-secondary); margin-bottom: 20px; }
    .plan-cta .btn-primary { text-decoration: none; display: inline-block; }
    .plan-fallback { text-align: center; padding: 60px 20px; }
    .plan-fallback h1 { font-family: var(--font-display); font-size: 28px; margin-bottom: 16px; }
    .plan-fallback p { color: var(--text-secondary); margin-bottom: 28px; }
  </style>
</head>
<body>
<div class="plan-page">
  <nav class="plan-nav">
    <a href="index.html" class="back">← Back to Psyked</a>
    <span class="brand">PSYKED.</span>
  </nav>
  <main class="plan-main" id="plan-main">
    <!-- rendered by JS -->
  </main>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// PSYKED — Personalized Plan renderer
// Reads ?stack=PFC,ACC,Amygdala&goal=PFC from the URL.
// ═══════════════════════════════════════════════════════════

const REGIONS = {
  PFC:          { name: 'Prefrontal Cortex',         abbr: 'PFC'   },
  Amygdala:     { name: 'Amygdala',                  abbr: 'AMY'   },
  Hippocampus:  { name: 'Hippocampus',              abbr: 'HIPPO' },
  Cerebellum:   { name: 'Cerebellum',               abbr: 'CRB'   },
  ACC:          { name: 'Anterior Cingulate Cortex', abbr: 'ACC'   },
  BrainStem:    { name: 'Brain Stem',               abbr: 'BS'    },
  BasalGanglia: { name: 'Basal Ganglia',            abbr: 'BG'    },
  Temporal:     { name: 'Temporal Lobe',            abbr: 'TL'    },
  Thalamus:     { name: 'Thalamus',                 abbr: 'THL'   },
};

const INSIGHTS = {
  PFC: "Your prefrontal cortex is under strain — likely from decision fatigue, poor sleep, or chronic stress. Your willpower muscle needs systematic training, not just more effort.",
  Amygdala: "Your amygdala is overactive — you’re running on a hair-trigger stress response. The good news: it’s one of the most trainable regions. Targeted breathwork and progressive exposure will rewire it fast.",
  Hippocampus: "Your hippocampus is running below capacity. You’re learning slower than your potential allows. Aerobic exercise and sleep optimization are the two fastest levers — and both are free.",
  Cerebellum: "Your cerebellum needs deliberate practice — specifically, feedback-rich repetition. You’re likely practicing volume without quality. Focused skill sessions with immediate feedback will unlock rapid motor improvement.",
  ACC: "Your anterior cingulate cortex — your grit circuit — is underdeveloped. The discomfort signal is winning too often. This is the most trainable form of mental toughness, but it requires intentional high-intensity exposure.",
  BrainStem: "Your autonomic foundation is shaky — poor sleep, breathing patterns, or recovery protocols. Every other brain region runs on what the brain stem provides. Fix this first.",
  BasalGanglia: "Your basal ganglia habit loops are weak or misfiring. You’re relying on willpower where you should be running on automation. The dopamine reward system needs recalibration.",
  Temporal: "Your temporal lobe processing is underutilized — you’re not absorbing and retaining information at your cognitive potential. Active listening and verbal rehearsal protocols will compound fast.",
  Thalamus: "Your thalamus is overwhelmed — you’re living in a high-noise environment and your sensory gating is struggling to filter it. Sleep quality and environmental design are your fastest wins.",
};

// The "start today" keystone protocol per region.
const START = {
  PFC: { title: "The 25-Minute Deep Work Block", desc: "Set a timer for exactly 25 minutes. One task only — no switching. After the timer: 5 minutes complete rest (no screens). Repeat up to 4 cycles. This is not a productivity hack — it’s a PFC training protocol. Consistent structured focus builds the neural circuits for sustained attention." },
  Amygdala: { title: "Physiological Sigh + Box Breathing", desc: "Before any high-stakes moment: 2 quick inhales through the nose (double-inhale), then one long exhale through the mouth. Repeat 3–5 times. Follow with box breathing (4 in — 4 hold — 4 out — 4 hold) for 3 minutes. Activates the parasympathetic system and directly downregulates amygdala reactivity." },
  Hippocampus: { title: "Zone 2 Aerobic Protocol", desc: "30–45 minutes of continuous aerobic exercise at 60–70% max heart rate (conversational pace), 3–4x per week. Walking, cycling, rowing — any steady-state cardio works. The single most evidence-backed intervention for hippocampal neurogenesis; BDNF release during Zone 2 directly accelerates learning and memory consolidation." },
  Cerebellum: { title: "Slow-Motion Deliberate Practice", desc: "20-minute focused skill sessions only. Perform your target movement at 30% speed with 100% cognitive attention. No reps on autopilot. Each rep: feel, adjust, improve. Quality over volume — your cerebellum learns from precise feedback, not repetition for its own sake." },
  ACC: { title: "The Voluntary Discomfort Protocol", desc: "Daily: choose one uncomfortable thing and do it intentionally — cold shower, hard interval, uncomfortable conversation, holding a difficult position. Start small (20 seconds) and increase weekly. The ACC is trained specifically by overriding the quit signal." },
  BrainStem: { title: "Sleep Architecture Optimization", desc: "Dark room (blackout curtains), cool temperature (18–20°C / 65–68°F), no screens 60 minutes before bed. Same wake time every day ±30 minutes — non-negotiable. The brain stem controls your autonomic baseline; consistent sleep timing is the single highest-leverage intervention." },
  BasalGanglia: { title: "Environment Design + Habit Stacking", desc: "Identify one target habit. Attach it to an existing automatic behavior (your anchor). Make the desired behavior require zero friction (equipment out, app open, gear ready). Remove friction from good habits; add friction to bad ones. The basal ganglia runs on environmental cues — design the environment, don’t rely on willpower." },
  Temporal: { title: "Active Recall After Every Session", desc: "Within 10 minutes of any coaching, meeting, or learning session: close everything and write down everything you remember — free recall, no notes. Then review what you missed. This retrieval practice doubles retention versus passive re-reading and directly engages temporal-lobe consolidation." },
  Thalamus: { title: "Sensory Hygiene Protocol", desc: "60 minutes per day of intentional low-stimulation: no music, podcasts, or background noise. One task, one sensory input at a time. Your thalamus is the brain’s sensory relay and filter; chronic high-stimulation environments overwhelm it. Structured quiet training restores filtering capacity." },
};

// Five supporting protocols per region (mirrors the main site).
const PROTOCOLS = {
  PFC: [
    ['Cold exposure', '2–3 min cold shower — activates PFC, suppresses amygdala'],
    ['Meditation', '10 min/day — thickens PFC gray matter over time'],
    ['Limit decision fatigue', 'Batch decisions, simplify daily choices'],
    ['Sleep 7–9h', 'PFC is the most sleep-sensitive region in the brain'],
    ['Progressive overload mindset', 'Treat discipline like a muscle — train it daily'],
  ],
  Amygdala: [
    ['Box breathing (4-4-4-4)', 'Directly calms amygdala activation within minutes'],
    ['Progressive exposure', 'Do hard things repeatedly to rewire your fear response'],
    ['Limit chronic stress', 'Elevated cortisol literally shrinks the amygdala over time'],
    ['Journaling', 'Externalizes threats, reducing the amygdala’s processing load'],
    ['Cold/heat contrast', 'Trains stress inoculation and emotional resilience'],
  ],
  Hippocampus: [
    ['Aerobic exercise', 'Biggest driver of hippocampal neurogenesis via BDNF'],
    ['REM sleep', 'Memory consolidation occurs primarily here during deep sleep'],
    ['Omega-3s (DHA)', 'Structural building block of hippocampal neurons'],
    ['Novel learning', 'New skills, routes, and challenges stimulate hippocampal growth'],
    ['Avoid chronic alcohol', 'Directly and measurably shrinks the hippocampus'],
  ],
  Cerebellum: [
    ['Deliberate practice', 'With feedback — cerebellum encodes movement patterns'],
    ['Proprioception training', 'Balance boards, single-leg work, unstable surfaces'],
    ['Visualization', 'Cerebellum activates during mental rehearsal — use it'],
    ['Cross-training', 'Skill variety builds richer, more transferable motor maps'],
    ['Adequate rest', 'Motor consolidation window requires recovery between sessions'],
  ],
  ACC: [
    ['High-intensity training', 'Trains the ACC to override pain signals repeatedly'],
    ['Mindfulness practice', 'Increases ACC thickness and improves attention regulation'],
    ['Goal-setting rituals', 'Activates the ACC before demanding tasks'],
    ['Caffeine (200–400mg)', 'Boosts ACC activity and reduces perceived effort'],
    ['Iron levels', 'ACC is sensitive to iron deficiency — get your bloods checked'],
  ],
  BrainStem: [
    ['Nasal breathing', 'Activates parasympathetic nervous system via brain stem'],
    ['Neck mobility work', 'Poor posture compresses brain stem arterial blood flow'],
    ['Consistent sleep schedule', 'Anchors circadian rhythm at the brain stem level'],
    ['Magnesium glycinate', '300mg before bed — supports brain stem sleep regulation'],
    ['Diaphragmatic breathing', 'Directly interfaces with vagus nerve (brain stem output)'],
  ],
  BasalGanglia: [
    ['Habit stacking', 'Leverages existing basal ganglia circuits for new behaviors'],
    ['Reward timing', 'Celebrate immediately after the desired behavior to anchor it'],
    ['Dopamine management', 'Avoid cheap dopamine (scrolling, junk food) before training'],
    ['Consistent schedule', 'Basal ganglia thrives on predictable, repeated routines'],
    ['Protein + tyrosine foods', 'Eggs, chicken, almonds — direct dopamine precursors'],
  ],
  Temporal: [
    ['Active listening', 'Deliberate focus during coaching sharpens temporal lobe encoding'],
    ['Music & rhythm training', 'Strengthens auditory cortex and motor timing'],
    ['Verbal rehearsal', 'Talking through plays or tactics deepens procedural memory'],
    ['Audiobooks & podcasts', 'Passive learning primes temporal association areas'],
    ['Social interaction', 'Conversation is the richest temporal lobe workout available'],
  ],
  Thalamus: [
    ['Sleep quality over quantity', 'Thalamic gating during deep sleep clears sensory backlog'],
    ['Sensory training', 'Vision, hearing, and proprioception drills sharpen relay speed'],
    ['Caffeine timing', 'Caffeine blocks thalamic adenosine receptors — time it to your peak window'],
    ['Mindfulness', 'Trains top-down thalamic filtering — choose where attention lands'],
    ['Limit sensory overload', 'Noisy, cluttered environments tax thalamic filtering capacity'],
  ],
};

const RANK_LABELS = ['#1', '#2', '#3'];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function getParams() {
  const p = new URLSearchParams(location.search);
  const stack = (p.get('stack') || '')
    .split(',')
    .map((s) => s.trim())
    .filter((s) => REGIONS[s])
    .slice(0, 3);
  const goal = REGIONS[p.get('goal')] ? p.get('goal') : '';
  return { stack, goal };
}

function renderFallback() {
  document.getElementById('plan-main').innerHTML = `
    <div class="plan-fallback">
      <h1>We couldn’t find your plan</h1>
      <p>This link looks incomplete. Take the 2-minute quiz to generate your personalized Priority Stack.</p>
      <a href="quiz.html" class="btn-primary" style="text-decoration:none;display:inline-block;">Take the Brain Performance Quiz →</a>
    </div>`;
}

function renderBlock(regionKey, i, goal) {
  const r = REGIONS[regionKey];
  const start = START[regionKey];
  const protos = PROTOCOLS[regionKey] || [];
  const isGoal = regionKey === goal;
  const protoList = protos.map((p, n) => `
    <li class="rb-protocol">
      <span class="num">${n + 1}</span>
      <span><strong>${esc(p[0])}</strong> — ${esc(p[1])}</span>
    </li>`).join('');
  return `
    <section class="region-block rank${i + 1}">
      <div class="rb-head">
        <div class="rb-rank">${RANK_LABELS[i]}</div>
        <div>
          <div class="rb-name">${esc(r.name)}</div>
          <div class="rb-abbr">${esc(r.abbr)}</div>
        </div>
        ${isGoal ? '<span class="rb-goal-tag">Your goal</span>' : ''}
      </div>
      <p class="rb-insight">${esc(INSIGHTS[regionKey] || '')}</p>
      ${start ? `
        <div class="rb-start">
          <div class="rb-start-label">⚡ Start today</div>
          <div class="rb-start-title">${esc(start.title)}</div>
          <div class="rb-start-desc">${esc(start.desc)}</div>
        </div>` : ''}
      <div class="rb-protocols-label">Your ${protos.length} targeted protocols</div>
      <ul class="rb-protocols">${protoList}</ul>
    </section>`;
}

function render() {
  const { stack, goal } = getParams();
  if (!stack.length) { renderFallback(); return; }

  const totalProtocols = stack.length * 5;
  const blocks = stack.map((key, i) => renderBlock(key, i, goal)).join('');

  document.getElementById('plan-main').innerHTML = `
    <header class="plan-header">
      <div class="plan-badge">✓ Your personalized plan</div>
      <h1 class="plan-title">Your Brain Performance Plan</h1>
      <p class="plan-sub">
        Based on your quiz, your Priority Stack targets <strong>${stack.length} brain regions</strong>
        with <strong>${totalProtocols} targeted protocols</strong>. Start with the keystone protocol
        in each, then layer in the rest.
      </p>
    </header>
    ${blocks}
    <div class="plan-cta">
      <p>Want the complete system — all 12 regions and 60 protocols?</p>
      <a href="https://latterligfett.gumroad.com/l/lqyis" class="btn-primary" target="_blank" rel="noopener">Get the full protocol guide →</a>
    </div>`;
}

render();
</script>
</body>
</html>
